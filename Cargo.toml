[package]
name = "smartthings_find"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["mqtt"]
# Home Assistant over MQTT discovery (and the `watch` push explorer).
mqtt = ["dep:rumqttc"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "form"] }
rumqttc = { version = "0.25.1", features = ["websocket"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
